<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name='viewport' content='width=device-width, initial-scale=1'>
<style>
  body{
    background: rgb(15,23,36);
    color: white;
    font-family: Arial, sans-serif;
    padding: 20px;
  }

  header nav a{
    color: white;
    margin-right: 15px;
    text-decoration: none;
    font-weight: bold;
  }

  nav a:hover{
    opacity: 0.7;
  }

  h2{
    margin-bottom: 20px;
  }

  /* Сетка видео */
  .video-grid{
    display: grid;
    grid-template-columns: repeat(3, 1fr); /* 3 видео в ряд */
    gap: 20px; /* расстояние между видео */
  }

  .video-grid video{
    width: 100%;
    height: auto;
    border-radius: 8px;
    box-shadow: 0 4px 10px rgba(0,0,0,0.5);
  }

  footer{
    margin-top: 40px;
    text-align: center;
  }

  /* Адаптив для мобильных */
  @media (max-width: 900px){
    .video-grid{
      grid-template-columns: repeat(2, 1fr);
    }
  }

  @media (max-width: 600px){
    .video-grid{
      grid-template-columns: 1fr;
    }
  }

</style>
</head>
