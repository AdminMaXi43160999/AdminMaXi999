<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Готовый сайт</title>

  <style>
    /* ======= ТВОЙ ПЕРВЫЙ CSS (анимации, базовые стили) ======= */
    *{margin:0;padding:0;box-sizing:border-box;font-family:Arial, sans-serif;}
    body{animation:fadein 1s ease;}
    @keyframes fadein{from{opacity:0;}to{opacity:1;}}
    header{position:sticky;top:0;z-index:10;}
    nav a{margin:0 15px;text-decoration:none;font-weight:bold;transition:0.3s;}
    nav a:hover{opacity:0.7;}
    .hero{height:250px;display:flex;align-items:center;justify-content:center;font-size:32px;font-weight:bold;}
    button, input, textarea{padding:10px;width:100%;margin-top:10px;border-radius:8px;border:1px solid #ccc;transition:0.3s;}
    button:hover{transform:scale(1.03);}
    footer{text-align:center;padding:20px;margin-top:40px;}

    /* ======= СОВРЕМЕННЫЙ СТИЛЬ ТВОЕГО ВТОРОГО САЙТА ======= */
    :root{
      --bg:#0f1724;
      --card:#0b1220;
      --accent:#4f46e5;
      --muted:#94a3b8;
      --glass:rgba(255,255,255,0.04)
    }

    body{
      background:linear-gradient(180deg,#071029 0%, #071733 100%);
      color:#e6eef8;
      line-height:1.5;
      font-family:Inter,ui-sans-serif,system-ui,-apple-system,'Segoe UI',Roboto,'Helvetica Neue',Arial;
    }

    .container{max-width:1100px;margin:0 auto;padding:28px;}

    header{
      display:flex;
      align-items:center;
      justify-content:space-between;
      padding:18px 0;
    }

    .brand{display:flex;gap:12px;align-items:center;}

    nav a{
      color:var(--muted);
      margin-left:18px;
      font-weight:600;
    }

    .hero{
      display:grid;
      grid-template-columns:1fr 420px;
      gap:28px;
      align-items:center;
      padding:36px 0;
      height:auto;
      font-size:unset;
    }

    .hero h1{font-size:36px;margin:0 0 12px;}
    .hero p{color:var(--muted);margin:0 0 18px;}

    .card{
      background:linear-gradient(180deg, rgba(255,255,255,0.02), rgba(255,255,255,0.01));
      border-radius:14px;
      padding:18px;
      box-shadow:0 6px 18px rgba(2,6,23,0.6);
    }

    .grid-gallery{
      display:grid;
      grid-template-columns:repeat(3,1fr);
      gap:10px;
    }

    .footer{
      border-top:1px solid rgba(255,255,255,0.04);
      padding:18px 0;
      margin-top:28px;
      color:var(--muted);
      display:flex;
      justify-content:space-between;
      align-items:center;
    }

    @media (max-width:900px){
      .hero{grid-template-columns:1fr;}
      .grid-gallery{grid-template-columns:repeat(2,1fr);}
    }

    @media (max-width:520px){
      .grid-gallery{grid-template-columns:1fr;}
      .hero h1{font-size:26px;}
    }
  </style>
</head>

<body>
  <div class="container">

    <!-- ========== HEADER ========== -->
    <header>
      <div class="brand">
        <div style="font-weight:700">мой сайт</div>
        <div style="font-size:12px;color:var(--muted)">Рахматов М</div>
      </div>

      <nav>
        <a href="index.html">Главная</a>
        <a href="about.html">О нас</a>
        <a href="services.html">Услуги</a>
        <a href="gallery.html">Галерея</a>
        <a href="мой сайт.html.html">Картинки</a>
      </nav>
    </header>

    <!-- ========== HERO ========== -->
    <main>
      <section class="hero">
        <div>
          <h1>Рахматов Мухаммад</h1>
          <p>Только для аниме фото</p>
        </div>
      </section>

      <!-- ========== GALLERY ========== -->
      <section id="gallery">
        <h2>Галерея</h2>
        <div class="grid-gallery" style="margin-top:12px">

          <div class="card" style="min-height:110px;display:flex;align-items:center;justify-content:center">
            <img src="1.jpeg" alt="Фото" style="max-width:100%; max-height:100%;">
          </div>

          <div class="card" style="min-height:110px;display:flex;align-items:center;justify-content:center">
            <img src="2.jpeg" alt="Фото" style="max-width:100%; max-height:100%;">
          </div>

          <div class="card" style="min-height:110px;display:flex;align-items:center;justify-content:center">
            <img src="3.jpeg" alt="Фото" style="max-width:100%; max-height:100%;">
          </div>

        </div>
      </section>

      <!-- ========== FOOTER ========== -->
      <footer class="footer">
        <div>© <span id="year"></span> сайт готов</div>
        <div>Сделано в VS Code</div>
      </footer>
    </main>

  </div>

<script>
  document.getElementById('year').textContent = new Date().getFullYear();
</script>

</body>
</html>
